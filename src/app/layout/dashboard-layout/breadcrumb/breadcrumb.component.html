<div class="relative overflow-hidden h-36 md:h-44">
  <img
    src="/assets/images/bg/sign-in-bg.png"
    alt="Dashboard banner"
    class="absolute inset-0 w-full h-full object-cover scale-105"
  />

  <div
    class="absolute inset-0 bg-linear-to-r from-cyan-900/70 via-cyan-800/40 to-transparent"
  ></div>
  <div class="absolute top-0 left-20 w-72 h-72 bg-white/10 blur-3xl rounded-full"></div>

  <div class="relative z-10 h-full flex items-center px-6 md:px-10">
    <div>
      <h1 class="text-white text-2xl md:text-3xl font-bold tracking-tight">{{ pageTitle() }}</h1>
      <p class="text-white/80 mt-1 text-sm md:text-base">{{ this.pageDescription() }}</p>
      <div class="flex justify-start mt-3">
        <z-breadcrumb class="text-white">
          <li z-breadcrumb-item>
            <a
              z-breadcrumb-link
              [routerLink]="homeLink"
              [attr.aria-label]="'nav.dashboard' | translate"
              [class]="pillClasses"
            >
              <fa-icon [icon]="icons.house" aria-hidden="true" />
            </a>
          </li>

          @for (item of items(); track $index; let last = $last) {
            <li z-breadcrumb-separator class="text-white/45"></li>
            <li z-breadcrumb-item>
              @if (last) {
                <span z-breadcrumb-page [class]="pillClasses + ' bg-white/8 border-white/10'">
                  {{ item.label }}
                </span>
              } @else if (item.disabled) {
                <span
                  z-breadcrumb-link
                  aria-disabled="true"
                  [class]="
                    pillClasses + ' cursor-default hover:bg-transparent hover:border-transparent'
                  "
                >
                  {{ item.label }}
                </span>
              } @else {
                <a z-breadcrumb-link [routerLink]="item.routerLink" [class]="pillClasses">
                  {{ item.label }}
                </a>
              }
            </li>
          }
        </z-breadcrumb>
      </div>
    </div>
  </div>
</div>
