<header
  class="sticky top-0 z-30 flex h-16 shrink-0 items-center gap-2 border-b bg-background/95 backdrop-blur supports-backdrop-filter:bg-background/80 transition-[width,height] ease-linear group-has-data-[collapsible=icon]/sidebar-wrapper:h-12"
>
  <div class="flex w-full items-center gap-2 px-4">
    <!-- Sidebar toggle -->
    <button z-sidebar-trigger class="-ml-1" aria-label="Toggle Sidebar"></button>

    <z-separator
      zOrientation="vertical"
      class="mr-2 data-[orientation=vertical]:h-4 data-[orientation=vertical]:self-center"
    />

    <!-- Search -->
    <div role="search" class="relative hidden w-full max-w-sm md:block">
      <ng-icon
        name="lucideSearch"
        class="pointer-events-none absolute left-2.5 top-1/2 size-4 -translate-y-1/2 text-muted-foreground"
      />
      <input
        #searchInput
        z-input
        id="header-search"
        name="search"
        type="search"
        autocomplete="off"
        class="pl-8 pr-14"
        [placeholder]="'layout.header.search.title' | translate"
        [attr.aria-label]="'layout.header.search.title' | translate"
      />
      <kbd
        class="pointer-events-none absolute right-2 top-1/2 inline-flex h-5 -translate-y-1/2 select-none items-center gap-0.5 rounded border bg-muted px-1.5 font-mono text-[10px] font-medium text-muted-foreground"
      >
        <span class="text-xs">⌘</span>K
      </kbd>
    </div>

    <!-- Actions -->
    <div class="ml-auto flex items-center gap-1">
      <app-theme-toggle />
      <app-language-dropdown />
      @if (webNotificationsEnabled()) {
        <app-notification-dropdown />
      }
    </div>
  </div>
</header>
