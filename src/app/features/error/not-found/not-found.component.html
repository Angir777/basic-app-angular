<div
  class="relative flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden z-1"
>
  <app-grid-shape />

  <div class="mx-auto w-full max-w-[242px] text-center sm:max-w-[472px]">
    <h1 class="mb-8 font-bold text-zinc-800 dark:text-zinc-800 text-title-md xl:text-title-2xl">
      {{ 'error.pageTitle.error' | translate }}
    </h1>

    <img src="/assets/images/error/404.svg" alt="404" class="dark:hidden" />
    <img src="/assets/images/error/404.svg" alt="404" class="hidden dark:block" />

    <p class="mt-10 mb-6 text-base text-zinc-600 dark:text-zinc-600 sm:text-lg">
      {{ 'error.texts.info' | translate }}
    </p>

    <a
      routerLink="/"
      class="inline-flex items-center justify-center rounded-lg border border-zinc-200 bg-white px-5 py-3.5 text-sm font-medium text-zinc-700 shadow-theme-xs hover:bg-zinc-100 hover:text-zinc-900 dark:border-zinc-200 dark:bg-white dark:text-zinc-700 dark:hover:bg-zinc-100 dark:hover:text-zinc-900"
    >
      {{ 'error.buttons.backToDashboard' | translate }}
    </a>
  </div>

  <p
    class="absolute text-sm text-center text-zinc-500 dark:text-zinc-500 -translate-x-1/2 bottom-6 left-1/2"
  >
    &copy; {{ currentYear }} - {{ 'main.appName' | translate }}
  </p>
</div>
