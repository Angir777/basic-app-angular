<div class="px-6 py-4 border-b border-gray-200 dark:border-zinc-800">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
    <h5 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      {{ 'role.pageTitle.roles' | translate }}
    </h5>

    <div class="flex flex-wrap gap-2 sm:ml-auto">
      <ng-container *ngTemplateOutlet="actionsButtons" />
    </div>
  </div>
</div>

<div class="p-6">
  <!-- Show/hide columns + Remember state -->
  <div class="flex flex-wrap mb-5">
    <div class="w-1/2 flex justify-start items-center">
      <app-table-column-selector
        [allColumns]="allColumns"
        [columnTranslations]="columnTranslations"
        [(selectedColumns)]="displayedColumns"
      />
    </div>

    <div class="w-1/2 flex justify-end items-center">
      @if (canChangeSaveState()) {
        <div class="px-2 flex items-center gap-2">
          <small class="text-sm text-gray-600 dark:text-white/90">
            {{ 'main.global.saveState' | translate }}
          </small>

          <ui-switch
            size="small"
            [(ngModel)]="saveState"
            [ngModelOptions]="{ standalone: true }"
          ></ui-switch>
        </div>
      }
    </div>
  </div>

  <!-- Table -->
  <div class="mat-table-wrapper relative overflow-hidden rounded-md">
    @if (isLoadingResults()) {
      <div
        class="absolute inset-0 z-10 flex items-center justify-center bg-white/10 backdrop-blur-xl"
      >
        <app-loader [isLoading]="true"></app-loader>
      </div>
    }

    <div
      class="overflow-x-auto rounded-lg border border-gray-200 dark:border-zinc-800 transition-all duration-300"
      [class.blur-sm]="isLoadingResults()"
      [class.opacity-60]="isLoadingResults()"
    >
      <table
        mat-table
        [dataSource]="data"
        matSort
        matSortActive="id"
        matSortDisableClear
        matSortDirection="desc"
      >
        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef disabled></th>

          <td mat-cell *matCellDef="let row">
            <div class="flex items-center gap-1">
              <!-- View change history -->
              <button
                (click)="openHistoryModal(row)"
                class="inline-flex size-9 items-center justify-center rounded-full border border-gray-300 bg-transparent text-gray-600 shadow-sm transition-colors hover:bg-gray-100 dark:border-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-800 cursor-pointer"
                [matTooltip]="'main.global.tooltip.history' | translate"
                matTooltipPosition="above"
              >
                <fa-icon [icon]="faClockRotateLeft" class="text-sm"></fa-icon>
              </button>

              <!-- View -->
              <a
                [routerLink]="['display', row.id]"
                class="inline-flex size-9 items-center justify-center rounded-full border border-gray-300 bg-transparent text-gray-600 shadow-sm transition-colors hover:bg-gray-100 dark:border-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-800 cursor-pointer"
                [matTooltip]="'main.global.tooltip.show' | translate"
                matTooltipPosition="above"
              >
                <fa-icon [icon]="faEye" class="text-sm"></fa-icon>
              </a>

              <!-- Edit -->
              <a
                *ngxPermissionsOnly="['ROLES_UPDATE']"
                [routerLink]="['edit', row.id]"
                class="inline-flex size-9 items-center justify-center rounded-full border border-gray-300 bg-transparent text-gray-600 shadow-sm transition-colors hover:bg-gray-100 dark:border-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-800 cursor-pointer"
                [matTooltip]="'main.global.tooltip.edit' | translate"
                matTooltipPosition="above"
              >
                <fa-icon [icon]="faEdit" class="text-sm"></fa-icon>
              </a>

              <!-- Delete -->
              <button
                *ngxPermissionsOnly="['ROLES_DELETE']"
                (click)="delete(row)"
                class="inline-flex size-9 items-center justify-center rounded-full border border-gray-300 bg-transparent text-gray-600 shadow-sm transition-colors hover:bg-gray-100 dark:border-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-800 cursor-pointer"
                [matTooltip]="'main.global.tooltip.delete' | translate"
                matTooltipPosition="above"
              >
                @if (row.isDeleting) {
                  <fa-icon [icon]="faSpinner" animation="spin" class="text-sm"></fa-icon>
                } @else {
                  <fa-icon [icon]="faTrashAlt" class="text-sm"></fa-icon>
                }
              </button>
            </div>
          </td>
        </ng-container>

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="p-2" style="width: 5%">
            <div class="flex flex-col gap-2 pt-3 pb-3 pt-3 pb-3">
              <label
                mat-sort-header="id"
                disableClear
                for="idFilter"
                class="font-medium text-gray-700 dark:text-gray-200"
              >
                {{ 'main.global.id' | translate }}
              </label>

              <input
                z-input
                id="idFilter"
                type="text"
                autocomplete="off"
                [(ngModel)]="criteria['filter[id]']"
                (keyup)="search()"
              />
            </div>
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.id }}
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="p-2">
            <div class="flex flex-col gap-2 pt-3 pb-3">
              <label
                mat-sort-header="name"
                disableClear
                for="nameFilter"
                class="font-medium text-gray-700 dark:text-gray-200"
              >
                {{ 'role.form.name' | translate }}
              </label>

              <input
                z-input
                id="nameFilter"
                type="text"
                autocomplete="off"
                [(ngModel)]="criteria['filter[name]']"
                (keyup)="search()"
              />
            </div>
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.name }}
          </td>
        </ng-container>

        <!-- Guard -->
        <ng-container matColumnDef="guardName">
          <th mat-header-cell *matHeaderCellDef class="p-2">
            <div class="flex flex-col gap-2 pt-3 pb-3">
              <label
                mat-sort-header="guardName"
                disableClear
                for="guardNameFilter"
                class="font-medium text-gray-700 dark:text-gray-200"
              >
                {{ 'role.form.guardName' | translate }}
              </label>

              <input
                z-input
                id="guardNameFilter"
                type="text"
                autocomplete="off"
                [(ngModel)]="criteria['filter[guardName]']"
                (keyup)="search()"
              />
            </div>
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.guardName }}
          </td>
        </ng-container>

        <!-- Assigned permissions -->
        <ng-container matColumnDef="permissionsCount">
          <th mat-header-cell *matHeaderCellDef class="p-2">
            <div class="flex flex-col gap-2 pt-3 pb-3">
              <label
                for="permissionsCountFilter"
                class="font-medium text-gray-700 dark:text-gray-200"
              >
                {{ 'role.form.permissionsCount' | translate }}
              </label>

              <input z-input id="permissionsCountFilter" type="text" disabled />
            </div>
          </th>

          <td mat-cell *matCellDef="let row">
            <span
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700"
            >
              {{ row.permissions?.length ?? 0 }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="hover:bg-gray-50 transition"
        ></tr>
      </table>
    </div>

    <!-- Paginator -->
    <div
      class="flex justify-end mt-4 transition-all duration-300"
      [class.blur-sm]="isLoadingResults()"
      [class.opacity-60]="isLoadingResults()"
    >
      <mat-paginator
        #paginator
        [showFirstLastButtons]="true"
        [length]="resultsLength()"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
      >
      </mat-paginator>
    </div>
  </div>
</div>

<div
  class="px-6 py-4 border-t border-gray-200 dark:border-zinc-800 flex flex-col items-start gap-3 sm:flex-row sm:items-center sm:justify-end"
>
  <ng-container *ngTemplateOutlet="actionsButtons" />
</div>

<!-- Actions -->
<ng-template #actionsButtons>
  <!-- Add -->
  <button
    *ngxPermissionsOnly="['ROLES_CREATE']"
    [routerLink]="['add']"
    class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-gray-200 text-gray-700 hover:bg-gray-100 transition cursor-pointer dark:border-zinc-800 dark:text-gray-200 dark:hover:bg-zinc-800 cursor-pointer"
    [matTooltip]="isMobileView ? ('main.global.button.add' | translate) : ''"
    matTooltipPosition="above"
  >
    <fa-icon [icon]="faPlus"></fa-icon>
    <span class="hidden lg:inline">
      {{ 'main.global.button.add' | translate }}
    </span>
  </button>
</ng-template>
