<form name="form" role="form" novalidate (ngSubmit)="onSubmit()" [formGroup]="form">
  @if (isLoading()) {
    <div class="flex justify-center py-12">
      <app-loader [isLoading]="true"></app-loader>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-6">
      <section class="rounded-lg border border-gray-200 p-5 dark:border-zinc-700">
        <h6 class="mb-6 text-base font-semibold text-gray-800 dark:text-white/90">
          {{ 'account.passwordTab.title' | translate }}
        </h6>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
          <!-- Current password -->
          <div class="flex flex-col gap-1.5">
            <label for="oldPassword" class="text-sm font-medium text-gray-700 dark:text-gray-200">
              {{ 'account.passwordTab.oldPassword' | translate }} *
            </label>

            <input
              z-input
              id="oldPassword"
              name="oldPassword"
              type="password"
              formControlName="oldPassword"
              autocomplete="current-password"
              [attr.aria-invalid]="
                isFormControlInvalid('oldPassword', 'oldPassword') ? 'true' : null
              "
              (keydown)="clearServerErrors('oldPassword')"
            />

            @if (isFormControlInvalid('oldPassword', 'oldPassword')) {
              <app-form-control-errors
                [errors]="form.get('oldPassword')?.errors"
                [serverErrors]="getServerErrors('oldPassword')"
              />
            }
          </div>

          <!-- New password -->
          <div class="flex flex-col gap-1.5">
            <label for="newPassword" class="text-sm font-medium text-gray-700 dark:text-gray-200">
              {{ 'account.passwordTab.newPassword' | translate }} *
            </label>

            <input
              z-input
              id="newPassword"
              name="newPassword"
              type="password"
              formControlName="newPassword"
              autocomplete="new-password"
              [attr.aria-invalid]="
                isFormControlInvalid('newPassword', 'newPassword') ? 'true' : null
              "
              (keydown)="clearServerErrors('newPassword')"
            />

            @if (isFormControlInvalid('newPassword', 'newPassword')) {
              <app-form-control-errors
                [errors]="form.get('newPassword')?.errors"
                [serverErrors]="getServerErrors('newPassword')"
              />
            }
          </div>

          <!-- Repeat password -->
          <div class="flex flex-col gap-1.5">
            <label
              for="passwordConfirmation"
              class="text-sm font-medium text-gray-700 dark:text-gray-200"
            >
              {{ 'account.passwordTab.passwordConfirmation' | translate }} *
            </label>

            <input
              z-input
              id="passwordConfirmation"
              name="passwordConfirmation"
              type="password"
              formControlName="passwordConfirmation"
              autocomplete="new-password"
              [attr.aria-invalid]="
                isFormControlInvalid('passwordConfirmation', 'passwordConfirmation') ? 'true' : null
              "
              (keydown)="clearServerErrors('passwordConfirmation')"
            />

            @if (isFormControlInvalid('passwordConfirmation', 'passwordConfirmation')) {
              <app-form-control-errors
                [errors]="form.get('passwordConfirmation')?.errors"
                [serverErrors]="getServerErrors('passwordConfirmation')"
              />
            }
          </div>
        </div>
      </section>
    </div>
  }

  <!-- Footer -->
  <div class="mt-4 flex justify-end">
    <!-- Save -->
    <app-save-button type="submit" [loading]="isSaving()"></app-save-button>
  </div>
</form>
